name: Conference Digest

on:
  schedule:
    # Weekly, Monday 08:00 UTC. The state machine no-ops when nothing is
    # new, so you only get issues when there's something to digest.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      conference:
        description: 'Registry key to force (e.g. nsdi-2025). Leave blank for normal scan.'
        required: false
        default: ''

permissions:
  contents: write   # commit prompts/ and state.json
  issues: write     # open the "ready" issue

concurrency:
  group: conference-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history so git pull --rebase works

      - name: Set up Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Install dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Find editions that ought to exist and aren't in the registry yet
      # (next year's KubeCon, the next IETF meeting number, ...) and append
      # them to registry.yaml. Runs BEFORE the generator so anything it finds
      # whose end_date has already passed is digested in this same run.
      # A forced single-conference run skips discovery: you asked for one
      # specific key, not a scan.
      - name: Discover new editions
        if: github.event.inputs.conference == ''
        id: discover
        env:
          # The NANOG fetcher reads nanog.org through Tavily Extract.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/discover_editions.py

      - name: Generate prompts and update state
        id: generate
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CONFERENCE: ${{ github.event.inputs.conference }}
        run: |
          if [ -n "$CONFERENCE" ]; then
            python scripts/generate_digest_prompt.py --conference "$CONFERENCE"
          else
            python scripts/generate_digest_prompt.py
          fi

      - name: Commit prompts and state
        run: |
          git config user.name  "conference-digest-bot"
          git config user.email "actions@github.com"
          # run_summary.json / discovery_summary.json are ephemeral (read by
          # the issue step in this same job) and intentionally NOT committed —
          # committing them every run made main churn and race with itself.
          # registry.yaml IS committed: the discovery step appends newly found
          # editions to it, and that record has to survive the run.
          git add prompts/ conferences/state.json conferences/registry.yaml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "digest run: update prompts and state ($(date -u +%F))"
          # The remote may have advanced between checkout and now. Rebase onto
          # latest main and retry the push a few times before giving up.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch origin main
            git pull --rebase origin main
          done
          echo "push failed after retries" >&2
          exit 1

      # Issues are bookkeeping, not a gate on drafting committed prompts.
      # A transient API failure must not suppress the workflow_run handoff.
      - name: Build issue content
        id: issue-content
        if: steps.generate.outputs.notify == 'true'
        continue-on-error: true
        run: python scripts/build_issue.py

      - name: Upsert issues
        if: steps.generate.outputs.notify == 'true' && steps.issue-content.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const issues = JSON.parse(fs.readFileSync('issues.json', 'utf8'));
            for (const it of issues) {
              const confLabel = it.labels.find(l => l.startsWith('conf:'));
              // Find an existing OPEN issue for this conference (by conf label).
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: confLabel,
              });
              if (existing.data.length > 0) {
                // Update body + labels in place (status may have changed).
                const num = existing.data[0].number;
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  title: it.title,
                  body: it.body,
                  labels: it.labels,
                });
                console.log(`updated #${num} for ${it.key} (${it.labels.join(',')})`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: it.title,
                  body: it.body,
                  labels: it.labels,
                });
                console.log(`opened #${created.data.number} for ${it.key}`);
              }
            }
