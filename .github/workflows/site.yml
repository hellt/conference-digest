name: Site

# Builds the Zensical site from digests/ and publishes it to GitHub Pages
# (gh-pages branch), the same way containerlab.dev is published. Pull requests
# that touch the site or a digest get the build only.

on:
  push:
    branches: [main]
    paths:
      - 'digests/**'
      - 'docs/**'
      - 'overrides/**'
      - 'layouts/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'scripts/build_site.py'
      - 'scripts/search_paths.py'
      - 'conferences/registry.yaml'
      - 'conferences/state.json'
      - 'conferences/tags.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'digests/**'
      - 'docs/**'
      - 'overrides/**'
      - 'layouts/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'scripts/build_site.py'
      - 'scripts/search_paths.py'
      - 'conferences/registry.yaml'
      - 'conferences/state.json'
      - 'conferences/tags.yaml'
      - '.github/workflows/site.yml'
  # The weekly scan commits state.json/registry.yaml with GITHUB_TOKEN, which
  # does not trigger push workflows; refresh the Conferences page after it.
  # The build checks whether such a scan actually advanced the default branch.
  workflow_run:
    workflows: [Conference Digest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Decide whether this run should publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          publish=true
          # A workflow_run payload retains the scan's original head SHA. If
          # checkout sees that same SHA, the scan committed nothing and there
          # is no reason to replace the already-deployed site.
          if [ "$EVENT_NAME" = workflow_run ] && [ "$(git rev-parse HEAD)" = "$SCAN_HEAD" ]; then
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Build site with Zensical
        run: make site

      - name: Upload built site for deployment
        if: github.event_name != 'pull_request' && steps.publish.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-site
          path: site
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # peaceiris/actions-gh-pages pushes the gh-pages branch
    steps:
      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Served from https://tldr.netdevops.me/ (DNS: tldr CNAME hellt.github.io).
          # The CNAME file this writes to gh-pages sets the Pages custom domain.
          cname: tldr.netdevops.me
