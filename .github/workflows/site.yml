name: Site

# Builds the Zensical site from digests/ and publishes it to GitHub Pages
# (gh-pages branch), the same way containerlab.dev is published. Pull requests
# that touch the site or a digest get the build only.

on:
  push:
    branches: [main]
    paths:
      - 'digests/**'
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'scripts/build_site.py'
      - 'conferences/registry.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'digests/**'
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/build_site.py'
  # The weekly scan commits state.json/registry.yaml with GITHUB_TOKEN, which
  # does not trigger push workflows; refresh the Conferences page after it.
  workflow_run:
    workflows: [Conference Digest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # peaceiris/actions-gh-pages pushes the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build site with Zensical
        run: make site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
