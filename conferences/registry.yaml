# Conference registry.
#
# Each entry describes one *edition* of a conference (a specific year's event).
# The orchestrator selects an edition for digesting when:
#   - its `end_date` is in the past (artifacts are usually published post-event), AND
#   - it has not already been digested (inferred: no digests/<key>.md exists), AND
#   - the fetcher successfully retrieves real program content.
#
# An edition that is past but whose artifacts are not yet published stays
# `pending` and is retried on every subsequent scheduled run until it succeeds
# or crosses the stall threshold (see conferences/state.json + orchestrator).
#
# FIELDS
#   key        Unique slug. Also the prompt/digest filename stem. No spaces.
#   name       Human-readable conference + year.
#   type       One of: academic | standards | vendor | operator | security
#              Drives how the universal prompt tells Claude to read the program.
#   start_date Optional ISO date the conference program began, for the site header.
#   end_date   ISO date (YYYY-MM-DD) the event ended. Selection is based on this.
#   fetcher    Which fetcher module handles it: usenix | ietf | sched | sigcomm | netdev | nanog | autocon | ovscon | ciscolive | ripe | nlnog | denog | gtc
#   program_url
#              The machine-or-human-readable program endpoint the fetcher pulls.
#   manual_fallback_url
#              Page for YOU to open and paste in if auto-fetch is blocked.
#              (USENIX and Sched can bot-block; this is the escape hatch.)
#   run_location
#              Optional: 'auto' (default) or 'local'. 'local' means the source
#              bot-blocks datacenter IPs (GitHub Actions), so CI must NOT fetch
#              it — you fetch it from your own machine with
#              `python3 scripts/generate_digest_prompt.py --conference <key>`.
#              The issue is still opened by CI; its body gives local instructions.
#   notes      Free text; surfaced in the prompt's front matter.
#   discovered Set only on entries scripts/discover_editions.py added by itself,
#              recording when. Its end_date may be an estimate from the series
#              hint rather than something the source stated — the issue body
#              says which. Correcting a discovered entry by hand is fine;
#              discovery only ever appends keys that aren't here yet.
#
# Most editions land here on their own: conferences/series.yaml describes the
# recurring conference (URL templates, how editions are numbered) and discovery
# appends next year's block once the source confirms it exists. Add a block by
# hand for a genuine one-off, or to fix something discovery got wrong.

