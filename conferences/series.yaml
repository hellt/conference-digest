# Conference SERIES — how the pipeline finds next year's edition by itself.
#
# registry.yaml holds *editions* (one specific year's event). This file holds
# the recurring conference behind them, and the rule for building the next one.
# scripts/discover_editions.py reads it every scheduled run, works out which
# editions ought to exist but aren't in the registry, probes the source, and
# appends the confirmed ones to registry.yaml. Nobody hand-adds a 2027 block.
#
# An edition is appended only when BOTH hold:
#   1. the fetcher's probe() says the source exists (not a 404, not a challenge)
#   2. the fetcher's real fetch() returns OK — i.e. there is a program we could
#      actually digest, not a placeholder page
# so a series that hasn't published yet is simply re-probed next run.
#
# FIELDS
#   series      Slug for this recurring conference. Log/report label only.
#   enumerate   How editions are numbered:
#                 year    - one per calendar year (KubeCon, SIGCOMM, USENIX)
#                 ordinal - a counter that just increments (IETF 124, 125...;
#                           Netdev 0x1A, 0x1B...)
#   key_template / name_template / *_url_template
#               Templates filled with, for `year` series:
#                 {year} 2026   {yy} 26
#               and for `ordinal` series:
#                 {n} 27   {hex} 1b   {HEX} 1B
#               key_template MUST match the keys already in registry.yaml —
#               discovery reads it backwards to find where the series is up to.
#   lookahead   How many unseen editions to probe per run (default 2). IETF
#               needs 3+ because it meets three times a year.
#   start       Optional first edition to consider when the registry has none
#               of this series yet (a brand-new series). Ignored otherwise.
#   end_date_hint
#               "MM-DD" fallback, used ONLY when the source doesn't state its
#               dates. Discovery prefers the real dates it scans off the page.
#   description One-sentence conference summary used on digest list cards.
#   fetcher / run_location / notes
#               Copied onto every discovered edition, exactly as registry.yaml
#               defines them (description is copied too).

series:

  # Cisco Live publishes regional editions into one public on-demand catalog.
  # The fetcher resolves year + region to the catalog's event ID; cities may
  # change, so see CITIES in ciscolive.py. No API dates: hints deliberately
  # overestimate the usual February/June event ends, and must be confirmed.
  - series: ciscolive-us
    enumerate: year
    key_template: "ciscolive-us-{year}"
    name_template: "Cisco Live US {year}"
    description: "Cisco's flagship conference for enterprise networking, data centers, automation, security, and cloud infrastructure."
    fetcher: ciscolive
    end_date_hint: "06-30"
    program_url_template: "https://www.ciscolive.com/on-demand/on-demand-library.html"
    manual_fallback_url_template: "https://www.ciscolive.com/on-demand/on-demand-library.html"
    notes: "Public on-demand abstracts and speakers; slides/recordings require login. Discovery dates are estimates: confirm against the event site."

  - series: ciscolive-eu
    enumerate: year
    key_template: "ciscolive-eu-{year}"
    name_template: "Cisco Live Europe {year}"
    description: "Cisco's flagship conference for enterprise networking, data centers, automation, security, and cloud infrastructure."
    fetcher: ciscolive
    end_date_hint: "03-31"
    program_url_template: "https://www.ciscolive.com/on-demand/on-demand-library.html"
    manual_fallback_url_template: "https://www.ciscolive.com/on-demand/on-demand-library.html"
    notes: "Public on-demand abstracts and speakers; slides/recordings require login. Discovery dates are estimates: confirm against the event site."

  # KubeCon EU and NA are separate series: different subdomains, different
  # halves of the year. Sched publishes the schedule months before the event,
  # so these get discovered early and then wait on end_date like anything else.
  - series: kubecon-eu
    enumerate: year
    key_template: "kubecon-eu-{year}"
    name_template: "KubeCon + CloudNativeCon Europe {year}"
    description: "The Cloud Native Computing Foundation's flagship conference for Kubernetes, cloud-native infrastructure, networking, and platform engineering."
    fetcher: sched
    end_date_hint: "04-04"
    program_url_template: "https://kccnceu{year}.sched.com/list/descriptions/"
    manual_fallback_url_template: "https://kccnceu{year}.sched.com/"
    notes: "Networking/eBPF/identity tracks; CiliumCon + eBPF Day co-located (separate Sched instances)."

  - series: kubecon-na
    enumerate: year
    key_template: "kubecon-na-{year}"
    name_template: "KubeCon + CloudNativeCon North America {year}"
    description: "The Cloud Native Computing Foundation's flagship conference for Kubernetes, cloud-native infrastructure, networking, and platform engineering."
    fetcher: sched
    end_date_hint: "11-14"
    program_url_template: "https://kccncna{year}.sched.com/list/descriptions/"
    manual_fallback_url_template: "https://kccncna{year}.sched.com/"
    notes: "Networking/eBPF/identity tracks; CNCF co-located days on separate Sched instances."

  - series: sigcomm
    enumerate: year
    key_template: "sigcomm-{year}"
    name_template: "ACM SIGCOMM {year}"
    description: "ACM's flagship conference on data communication, covering network architecture, protocols, systems, measurement, and security."
    fetcher: sigcomm
    end_date_hint: "09-11"
    program_url_template: "https://conferences.sigcomm.org/sigcomm/{year}/program/papers-info/"
    manual_fallback_url_template: "https://conferences.sigcomm.org/sigcomm/{year}/program/papers-info/"
    notes: "Flagship data-comm research: datacenter, transport, measurement, hardware, NetAI. Per-paper video links included."

  # USENIX slugs carry a two-digit year (nsdi26, usenixsecurity26). The site
  # bot-blocks datacenter IPs, so discovery for these only works on a local
  # run — in CI they are reported as needing one, never silently dropped.
  - series: nsdi
    enumerate: year
    key_template: "nsdi-{year}"
    name_template: "NSDI '{yy} (USENIX Symposium on Networked Systems Design and Implementation)"
    description: "Peer-reviewed research on the design, implementation, and operation of networked and distributed systems."
    fetcher: usenix
    run_location: local
    end_date_hint: "04-30"
    program_url_template: "https://www.usenix.org/conference/nsdi{yy}/technical-sessions"
    manual_fallback_url_template: "https://www.usenix.org/conference/nsdi{yy}/technical-sessions"
    notes: "Core networking research: datacenter, transport, verification, ML systems."

  - series: usenix-security
    enumerate: year
    key_template: "usenix-security-{year}"
    name_template: "USENIX Security '{yy}"
    description: "Research and practitioner advances in systems security, network security, privacy, identity, and applied cryptography."
    fetcher: usenix
    run_location: local
    end_date_hint: "08-15"
    program_url_template: "https://www.usenix.org/conference/usenixsecurity{yy}/technical-sessions"
    manual_fallback_url_template: "https://www.usenix.org/conference/usenixsecurity{yy}/technical-sessions"
    notes: "Systems & network security, identity, authentication, applied crypto."

  - series: srecon-americas
    enumerate: year
    key_template: "srecon-{year}-americas"
    name_template: "SREcon{yy} Americas"
    description: "Engineering and operating reliable, complex distributed systems at scale, with deep technical discussions and production lessons."
    fetcher: usenix
    run_location: local
    end_date_hint: "03-27"
    program_url_template: "https://www.usenix.org/conference/srecon{yy}americas/program"
    manual_fallback_url_template: "https://www.usenix.org/conference/srecon{yy}americas/program"
    notes: "Reliability/ops angle. SREcon uses /program, not /technical-sessions."

  # IETF meets three times a year and datatracker publishes meeting numbers,
  # dates and host city years ahead — so the ietf fetcher's probe() reads the
  # meeting API and discovery never has to guess an end_date or a location.
  - series: ietf
    enumerate: ordinal
    lookahead: 4
    key_template: "ietf-{n}"
    name_template: "IETF {n}"
    description: "The Internet Engineering Task Force meeting for developing Internet standards across routing, transport, security, and applications."
    fetcher: ietf
    program_url_template: "https://datatracker.ietf.org/meeting/{n}/agenda.json"
    manual_fallback_url_template: "https://datatracker.ietf.org/meeting/{n}/agenda"
    notes: "Filter to WGs relevant to networking/security/identity (oauth, scitt, wimse, rats, masque, tls, dnsop, ipsecme, anima, savnet)."

  # Netdev editions are hex-numbered: 0x19, 0x1A, 0x1B. The key lowercases it
  # (netdev-0x1b) while the URL path keeps the site's uppercase (0x1B).
  - series: netdev
    enumerate: ordinal
    ordinal_format: hex
    key_template: "netdev-0x{hex}"
    name_template: "Netdev 0x{HEX}"
    description: "A technical conference on Linux kernel networking, including eBPF/XDP, packet processing, NIC offload, and transport internals."
    fetcher: netdev
    end_date_hint: "07-16"
    program_url_template: "https://netdevconf.info/0x{HEX}/pages/sessions.html"
    manual_fallback_url_template: "https://netdevconf.info/0x{HEX}/pages/sessions.html"
    notes: "Linux kernel networking: kernel datapath/eBPF/XDP, NIC offload, transport internals."

  # NANOG meets three times a year (February, June, October). nanog.org blocks
  # automated clients, so the fetcher reads the public agenda through Tavily
  # Extract (owner-approved; see conferences/fetchers/nanog.py) and needs the
  # TAVILY_API_KEY secret. The agenda's day headers give exact dates.
  - series: nanog
    enumerate: ordinal
    key_template: "nanog-{n}"
    name_template: "NANOG {n}"
    description: "The North American Network Operators' Group meeting on Internet operations, routing, interconnection, infrastructure, and automation."
    fetcher: nanog
    lookahead: 2
    program_url_template: "https://nanog.org/events/nanog-{n}/agenda/"
    manual_fallback_url_template: "https://nanog.org/events/nanog-{n}/agenda/"
    notes: "North American network operators: routing security, peering, optics, DC and backbone operations, automation."

  # AutoCon, the Network Automation Forum's conference: spring in Europe, fall in
  # the US. The edition page is open HTML; abstracts come from NAF's program
  # guide repo when it has one and from NAF's YouTube uploads (see
  # conferences/fetchers/autocon.py). Placeholder pages for future editions
  # have no program, so discovery only adds an edition once its program is up.
  - series: autocon
    enumerate: ordinal
    key_template: "autocon-{n}"
    name_template: "AutoCon {n}"
    description: "A practitioner conference on network automation, orchestration, observability, source of truth, testing, and AI for NetOps."
    fetcher: autocon
    lookahead: 2
    program_url_template: "https://networkautomation.forum/autocon{n}"
    manual_fallback_url_template: "https://networkautomation.forum/autocon{n}"
    notes: "Network automation practitioners: source of truth, orchestration, observability, testing, AI for NetOps, adoption stories."

  # Annual OVS+OVN community conference. One static page joins schedule rows,
  # abstracts and materials by #tN anchors; discovery reads dates from its intro.
  - series: ovscon
    enumerate: year
    key_template: "ovscon-{year}"
    name_template: "Open vSwitch and OVN {year} Fall Conference"
    description: "The Open vSwitch and OVN community conference on virtual networking, hardware offload, Kubernetes networking, and programmable infrastructure."
    fetcher: ovscon
    program_url_template: "https://www.openvswitch.org/support/ovscon{year}/"
    manual_fallback_url_template: "https://www.openvswitch.org/support/ovscon{year}/"
    notes: "OVS/OVN and OVN-Kubernetes: virtual networking, BGP/EVPN fabric integration, hardware offload, DPUs, network security and scale."

  # RIPE meets twice a year. The new meeting-plan layout starts with RIPE 91.
  - series: ripe
    enumerate: ordinal
    start: 91
    key_template: "ripe-{n}"
    name_template: "RIPE {n}"
    description: "A European operator meeting on Internet infrastructure, routing, DNS, peering, measurement, policy, and network automation."
    fetcher: ripe
    lookahead: 2
    program_url_template: "https://ripe{n}.ripe.net/programme/meeting-plan/"
    manual_fallback_url_template: "https://ripe{n}.ripe.net/programme/meeting-plan/"
    notes: "European network operators: routing security, IPv6, peering, DNS, measurement and network automation."

  - series: nlnog
    enumerate: year
    start: 2025
    key_template: "nlnog-{year}"
    name_template: "NLNOG Day {year}"
    description: "The Dutch network operators' meeting on routing, Internet infrastructure, automation, and operational practice."
    fetcher: nlnog
    program_url_template: "https://nlnog.net/events/nlnog-day-{year}/"
    manual_fallback_url_template: "https://nlnog.net/events/nlnog-day-{year}/"
    notes: "Dutch network operators: routing, IPv6, automation and infrastructure operations. Program lists titles, speakers, slides and recordings, not abstracts."

  # The official agenda links to the right Pretalx host (changed after DENOG17).
  - series: denog
    enumerate: ordinal
    start: 17
    key_template: "denog-{n}"
    name_template: "DENOG {n}"
    description: "The German network operators' conference on Internet infrastructure, routing, data centers, automation, and security."
    fetcher: denog
    lookahead: 2
    program_url_template: "https://www.denog.de/de/meetings/denog{n}/agenda.html"
    manual_fallback_url_template: "https://www.denog.de/de/meetings/denog{n}/agenda.html"
    notes: "German network operators: datacenter and backbone networking, BGP/EVPN, optics, automation, security and operator workshops."
  # NVIDIA GTC (San Jose), each March. The catalog page is a client-rendered
  # app, so the fetcher resolves the per-year JS bundle it embeds (gtc26.js),
  # which carries the opaque event id the JSON catalog API needs plus a
  # day->date map — discovery gets exact dates from the source. A year's
  # bundle 404s until that edition's site is built and disappears once the
  # site moves on; redo past editions from the committed prompt. Recordings
  # land on NVIDIA on-demand (login-gated) and many later on NVIDIA's
  # YouTube channel, which the links step finds.
  - series: gtc
    enumerate: year
    key_template: "gtc-{year}"
    name_template: "NVIDIA GTC {year} (San Jose)"
    description: "NVIDIA's conference on accelerated computing, AI infrastructure, networking, and large-scale AI systems."
    fetcher: gtc
    end_date_hint: "03-21"
    program_url_template: "https://www.nvidia.com/gtc/session-catalog/"
    manual_fallback_url_template: "https://www.nvidia.com/en-us/on-demand/search/?facet.event_name%5B%5D=GTC%20San%20Jose&facet.event_year%5B%5D={year}"
    notes: "NVIDIA's AI conference: AI-factory networking (Spectrum-X, InfiniBand, NVLink, BlueField/DOCA), accelerated infrastructure, AI security and confidential computing."


  # ACM CCS: the Big-Four security conference. The public schedule lists every
  # paper with its exact title and authors, grouped by session with room and
  # dates; abstracts and full papers stay behind the ACM DL, so picks are
  # written from title, authors and session only. The schedule appears about
  # two weeks before the event; older editions keep no schedule page, so the
  # series starts at 2026.
  - series: ccs
    enumerate: year
    key_template: "ccs-{year}"
    name_template: "ACM CCS {year}"
    description: "ACM's flagship computer security conference covering applied cryptography, authentication, systems and network security, privacy, and measurement."
    fetcher: ccs
    start: 2026
    end_date_hint: "11-21"
    program_url_template: "https://www.sigsac.org/ccs/CCS{year}/program/schedule.html"
    manual_fallback_url_template: "https://www.sigsac.org/ccs/CCS{year}/program/schedule.html"
    notes: "Top-tier security research: applied crypto, authentication and identity, network security, systems security, measurement. Papers and abstracts are ACM DL-only; the schedule carries titles, authors and sessions."

  # ACM IMC: the program page lists every paper with authors, a full abstract
  # and the doi.org Paper link, grouped by session. Older editions (2025 and
  # back) are not kept on this program layout, so the series starts at 2026.
  - series: imc
    enumerate: year
    key_template: "imc-{year}"
    name_template: "ACM IMC {year}"
    description: "ACM's Internet measurement conference on network topology, performance, security, censorship, and Internet-wide analysis."
    fetcher: imc
    start: 2026
    end_date_hint: "10-31"
    program_url_template: "https://conferences.sigcomm.org/imc/{year}/program/"
    manual_fallback_url_template: "https://conferences.sigcomm.org/imc/{year}/program/"
    notes: "Premier Internet measurement research: datacenter and CDN measurement, topology and interdomain, transport, DNS, security and censorship measurement. Papers link doi.org ACM DL pages."

  # ACM CoNEXT: the conference site is an Angular app whose pages are all
  # server-rendered partials; the program partial lists every paper with
  # authors, a full abstract and its ACM DL links, grouped by session. The
  # preliminary program (few months out) holds no papers yet, so discovery
  # adds an edition only once the full program is up.
  - series: conext
    enumerate: year
    key_template: "conext-{year}"
    name_template: "ACM CoNEXT {year}"
    description: "ACM's conference on emerging networking experiments and systems, from transport and data centers to wireless and measurement."
    fetcher: conext
    start: 2025
    end_date_hint: "12-05"
    program_url_template: "https://conferences.sigcomm.org/co-next/{year}/partials/program.html"
    manual_fallback_url_template: "https://conferences.sigcomm.org/co-next/{year}/partials/program.html"
    notes: "Emerging networking research: datacenter, transport (QUIC), edge and wireless, measurement, network security. Papers link their ACM DL page and PDF."

  # APRICOT: APNIC's open conference API serves the schedule app behind every
  # {year}.apricot.net site. The events listing names each edition with its id,
  # dates and city (the probe reads it directly), and the event document lists
  # every agenda item with speaker, affiliation, abstract and slides. Sessions
  # with a YouTube live link attach it only when they hold a single talk.
  - series: apricot
    enumerate: year
    key_template: "apricot-{year}"
    name_template: "APRICOT {year}"
    description: "The Asia-Pacific Internet operators' summit on routing, peering, DNS, infrastructure, security, and automation."
    fetcher: apricot
    start: 2025
    lookahead: 3
    program_url_template: "https://api.apnic.net/web/v1/events"
    manual_fallback_url_template: "https://{year}.apricot.net/programme/"
    notes: "The Asia-Pacific operators summit (with APNIC): routing, peering, datacenter and backbone operations, DNS, security, automation."

  # FOSDEM publishes the whole edition as one Pentabarf schedule XML — the
  # same feed the mobile apps use — with per-event pages, abstracts, speakers,
  # slide attachments and video.fosdem.org recordings. The event is far wider
  # than this digest's reader, so the fetcher keeps a curated track set
  # (network, eBPF, DNS, AI, HPC/data science, containers,
  # virtualization/cloud infrastructure, kernel, main) and drops workshops
  # and lightning talks; edit RELEVANT_TRACKS in fosdem.py as interests shift.
  - series: fosdem
    enumerate: year
    key_template: "fosdem-{year}"
    name_template: "FOSDEM {year}"
    description: "Europe's large free and open-source software conference, with dedicated tracks for networking, security, infrastructure, and open standards."
    fetcher: fosdem
    start: 2026
    program_url_template: "https://fosdem.org/{year}/schedule/xml"
    manual_fallback_url_template: "https://fosdem.org/{year}/schedule/"
    notes: "Europe's largest FOSS event: open-source networking (Linux, OVS, eBPF/XDP), DNS, AI, cloud and Kubernetes devrooms. Curated track filter in the fetcher; per-talk pages, slides and video.fosdem.org recordings."

  # hack.lu runs its CfP on pretalx.com, whose public schedule export gives
  # every talk with speakers, full abstract and its Pretalx page. The fetcher
  # is the generic Pretalx one (also used by CfgMgmtCamp); the series points
  # program_url straight at the JSON export.
  - series: hacklu
    enumerate: year
    key_template: "hacklu-{year}"
    name_template: "hack.lu {year}"
    description: "An open security conference organized by CIRCL, covering offensive and defensive security, privacy, identity, and Internet infrastructure."
    fetcher: pretalx
    start: 2025
    lookahead: 3
    program_url_template: "https://pretalx.com/hack-lu-{year}/schedule/export/schedule.json"
    manual_fallback_url_template: "https://pretalx.com/hack-lu-{year}/schedule/"
    notes: "Open security conference run by CIRCL (Luxembourg CERT): offensive and defensive security, privacy, identity. Full abstracts from the Pretalx export; trainings/workshops included as talks."

  # TNC (GÉANT's research and education networking conference). The per-year
  # WordPress site 403s datacenter clients, so the probe reads it through
  # Tavily Extract (owner-approved, 2026-11-01) for the dates. The programme
  # itself is a client-side app with no public data endpoint, and the GÉANT
  # Indico behind it is bot-walled too — so fetch() returns manual_fallback and
  # TNC digests are written from the manual-paste path. Recordings land on the
  # GÉANT YouTube channel for the links step.
  - series: tnc
    enumerate: year
    key_template: "tnc-{year}"
    name_template: "TNC{yy} (GÉANT research networking conference)"
    description: "GÉANT's research and education networking conference on NREN infrastructure, campus and data-center networking, identity, and security."
    fetcher: tnc
    start: 2026
    end_date_hint: "06-12"
    program_url_template: "https://tnc{yy}.geant.org/"
    manual_fallback_url_template: "https://tnc{yy}.geant.org/programme/"
    notes: "European NREN conference: campus and DC networking for research, R&E infrastructure, identity federation, security. Program is pasted by hand (JS-only source); see FINDINGS-2026-11-new-conferences.md."

  # ARIN's Public Policy and Members Meetings: the per-meeting agenda page is
  # plain HTML tables — Agenda Item | Speaker | Presentation | Webcast. Policy
  # rows link their draft page, presentations are PDFs, and every agenda item
  # carries a timestamped YouTube webcast link. The North-American RIR
  # counterpart to the RIPE series.
  - series: arin
    enumerate: ordinal
    key_template: "arin-{n}"
    name_template: "ARIN {n} Public Policy and Members Meeting"
    description: "ARIN's public policy and members meeting on Internet number resources, registry operations, IPv6, routing security, and governance."
    fetcher: arin
    start: 56
    lookahead: 3
    program_url_template: "https://www.arin.net/participate/meetings/ARIN{n}"
    manual_fallback_url_template: "https://www.arin.net/participate/meetings/ARIN{n}"
    notes: "North American RIR meeting: IPv6, routing security/RPKI, Internet number resource policy, DNS and ARIN services. Agenda items with speakers, slide PDFs and timestamped YouTube webcasts."

  # LACNIC: every lacnic<n>.lacnic.net site is a React app that loads from one
  # open WP REST API (apievt.lacnic.net). The our_events taxonomy maps edition
  # numbers to term ids; the agenda posts then give each item an English and
  # Spanish title, description, speakers, session group, YouTube recordings
  # (per language) and presentation media ids resolved to slide URLs. The
  # agenda timestamps are also the probe's date source.
  - series: lacnic
    enumerate: ordinal
    key_template: "lacnic-{n}"
    name_template: "LACNIC {n}"
    description: "The Latin American and Caribbean Internet registry meeting on routing, IPv6, DNS, peering, security, and regional policy."
    fetcher: lacnic
    start: 45
    lookahead: 3
    program_url_template: "https://apievt.lacnic.net/wp-json/wp/v2"
    manual_fallback_url_template: "https://lacnic{n}.lacnic.net/"
    notes: "Latin American RIR meeting with LACNOG: routing, IPv6, DNS, peering and IX, network security, CSIRTs. Titles are English when the source has them, Spanish otherwise."

  # PETS: the accepted-papers list is one static page per edition — every paper
  # with its exact title and authors, grouped by PoPETs issue. Abstracts and
  # papers live in the PoPETs journal, so picks are written from title and
  # authors. The page carries no dates; end_date_hint covers discovery.
  - series: pets
    enumerate: year
    key_template: "pets-{year}"
    name_template: "PETS {year} (Privacy Enhancing Technologies Symposium)"
    description: "The Privacy Enhancing Technologies Symposium on anonymity, privacy engineering, measurement, identity, and usable privacy."
    fetcher: pets
    start: 2026
    end_date_hint: "07-25"
    program_url_template: "https://petsymposium.org/{year}/paperlist.php"
    manual_fallback_url_template: "https://petsymposium.org/{year}/paperlist.php"
    notes: "Privacy research symposium: privacy tech and identity, anonymity networks, traffic analysis, measurement, usable privacy. Papers are in the PoPETs journal; the list carries titles, authors and issues."

  # AusNOG: one program page per year with a table per conference day —
  # time, slide icon, video icon, bold title with speaker and affiliation.
  # The icon links are the real materials (PDF decks, YouTube recordings);
  # the day captions carry no year, so the series uses an end_date_hint.
  - series: ausnog
    enumerate: year
    key_template: "ausnog-{year}"
    name_template: "AusNOG {year}"
    description: "The Australian network operators' conference on Internet infrastructure, peering, data centers, routing, automation, and security."
    fetcher: ausnog
    start: 2025
    end_date_hint: "09-05"
    program_url_template: "https://www.ausnog.net/events/ausnog-{year}/program"
    manual_fallback_url_template: "https://www.ausnog.net/events/ausnog-{year}/program"
    notes: "Australian network operators: backbone and DC operations, IPv6, peering, optics, automation, network security. Titles, speakers, slide PDFs and YouTube recordings; no abstracts published."

  # NZNOG: nznog.org hosts one site per conference, and the accepted-talks
  # page (talks.html) lists every talk with its abstract — but it states no
  # dates. The conference landing page one level up does (as day-of-week
  # rows), so the fetcher's probe reads the dates there and discovery needs
  # no end_date_hint despite the drifting months (March–May so far).
  - series: nznog
    enumerate: year
    key_template: "nznog-{year}"
    name_template: "NZNOG {year}"
    description: "The New Zealand network operators' conference on Internet infrastructure, peering, DNS, routing security, optics, and automation."
    type: operator
    fetcher: nznog
    start: 2025
    lookahead: 2
    program_url_template: "https://www.nznog.org/conferences/nznog-{year}/talks.html"
    manual_fallback_url_template: "https://www.nznog.org/conferences/nznog-{year}/talks.html"
    notes: "New Zealand network operators: IX and peering, DNS, routing security, optics, network automation. Titles, speakers and abstracts from the accepted-talks page; recordings are whole-day streams, with per-talk links added where transcript offsets have been reviewed."

  # Peering Days: each edition gets its own site (<year>.peeringdays.eu) with
  # a static programme page — day headings, one block per slot, bold titles,
  # an "(Speaker: IXP - Name)" line and Download links for the decks. Only
  # workshops publish abstracts. The 2027 site was already announced but its
  # TLS was broken at add time; discovery simply retries until it works.
  - series: peeringdays
    enumerate: year
    key_template: "peeringdays-{year}"
    name_template: "Peering Days {year}"
    description: "A Central and Eastern European conference on interconnection, Internet exchanges, routing security, optics, and data-center interconnect."
    fetcher: peeringdays
    start: 2026
    end_date_hint: "03-31"
    program_url_template: "https://{year}.peeringdays.eu/programme/"
    manual_fallback_url_template: "https://{year}.peeringdays.eu/programme/"
    notes: "The largest peering conference in Central and Eastern Europe (NIX.CZ, BIX, VIX): peering, interconnection, RPKI, optics, datacenter interconnect. Titles, speakers (IXP - speaker), slide PDFs; abstracts only for workshops."

  # MORE-IP, AMS-IX's interconnection event. The agenda page is plain
  # WordPress HTML — day sections, one article per slot with title, speaker
  # ("Name - Company"), a short blurb and, for some items, the YouTube
  # recording. Breaks are grey articles. Attendance is AMS-IX member- and
  # partner-facing but the agenda and recordings are public.
  - series: moreip
    enumerate: year
    key_template: "moreip-{year}"
    name_template: "MORE-IP {year}"
    description: "AMS-IX's community event on interconnection, peering, Internet exchanges, connectivity policy, and digital infrastructure."
    fetcher: moreip
    start: 2025
    end_date_hint: "05-29"
    program_url_template: "https://more-ip-event.net/more-ip-{year}/agenda/"
    manual_fallback_url_template: "https://more-ip-event.net/more-ip-{year}/agenda/"
    notes: "AMS-IX interconnection event (~300 participants): IX and DC interconnect, peering, European connectivity policy, DNS and internet resilience. Titles, speakers, blurbs and YouTube recordings."

  # SwiNOG: each meeting gets one page under /meetings/swinog<n>/ with the
  # program plugin — one article per talk (title, "Name · Company", abstract,
  # Slides/Video link spans) and a Quick facts box with the dates. Recordings
  # exist since 2014; decks can appear days after the meeting, which is why
  # Links Refresh and prompt regeneration matter for recent editions.
  - series: swinog
    enumerate: ordinal
    key_template: "swinog-{n}"
    name_template: "SwiNOG #{n}"
    description: "The Swiss network operators' meeting on Internet infrastructure, routing, peering, data centers, automation, and security."
    fetcher: swinog
    start: 41
    lookahead: 2
    program_url_template: "https://www.swinog.ch/meetings/swinog{n}/"
    manual_fallback_url_template: "https://www.swinog.ch/meetings/swinog{n}/"
    notes: "Swiss network operators (~150-300 per meeting, 25+ years): routing, peering, datacenter networking, optics, automation, security. Talks with full abstracts; slides and recordings when published."

  # Capacity Europe: the agenda looks like a JS app, but the whole session
  # library is server-rendered — one day wrapper per day (id="13-oct-2026"),
  # one li per session with its page link, description, speakers with
  # "Name, Role - COMPANY", stream tags and times. A commercial event: no
  # recordings or slides, so items carry the session page only. Social-agenda
  # items are dropped. The year moves into the event's own domain; discovery
  # keeps probing capacityeurope.com/agenda/ and reads the year from the day
  # wrapper ids.
  - series: capacity-europe
    enumerate: year
    key_template: "capacity-{year}"
    name_template: "Capacity Europe {year}"
    description: "A carrier and digital-infrastructure conference on connectivity, fiber, subsea cables, data centers, AI infrastructure, and investment."
    fetcher: capacity
    start: 2026
    end_date_hint: "10-16"
    program_url_template: "https://www.capacityeurope.com/agenda/"
    manual_fallback_url_template: "https://www.capacityeurope.com/agenda/"
    notes: "Europe's largest carrier and digital-infrastructure marketplace (~4,000 attendees): fibre, data centres, subsea, AI infrastructure build, energy. Panels and keynotes with company affiliations; no recordings or slides."

  # NetUK: the UK's new network infrastructure community. Its Indico event
  # ids match the edition numbers (indico.netuk.org/event/3 = NetUK3), so the
  # series template points straight at the event page and the generic Indico
  # fetcher reads the open export. Contributions carry full abstracts.
  - series: netuk
    enumerate: ordinal
    key_template: "netuk-{n}"
    name_template: "NetUK{n}"
    description: "The UK network infrastructure community meeting on Internet exchanges, peering, routing, automation, and operational practice."
    fetcher: indico
    start: 2
    lookahead: 2
    program_url_template: "https://indico.netuk.org/event/{n}/"
    manual_fallback_url_template: "https://indico.netuk.org/event/{n}/"
    notes: "UK network infrastructure community (The Brewery, London): backbone and DC networking, IX and peering, automation, security. Full abstracts from the Indico export."

  # GRNOG runs on the NOG Alliance Indico. The category listing shows only
  # upcoming events, so discovery resolves future editions by name; past ones
  # (like GRNOG 20, event 13) are hand-added below with their event URL.
  - series: grnog
    enumerate: ordinal
    key_template: "grnog-{n}"
    name_template: "GRNOG {n}"
    description: "The Greek network operators' meeting on Internet infrastructure, routing, security, and operational practice."
    fetcher: indico
    start: 21
    lookahead: 2
    program_url_template: "https://grnog.indico.nogalliance.org/category/0/"
    manual_fallback_url_template: "https://grnog.indico.nogalliance.org/"
    notes: "Greek network operators (Athens): peering and IX, routing and RPKI, optical transport, DC networking, automation. Contributions carry abstracts, speakers and material via the Indico export."

  # DKNOG: each edition gets its own subdomain (dknog16.dknog.dk, ...), whose
  # root redirects straight to the event on the shared events.dknog.dk
  # backend — and the redirect target's host is also where the export API
  # lives, which is how the generic Indico fetcher resolves both. Contributions
  # carry abstracts and material.
  - series: dknog
    enumerate: ordinal
    key_template: "dknog-{n}"
    name_template: "DKNOG{n}"
    description: "The Danish network operators' meeting on Internet infrastructure, routing, security, automation, and operational practice."
    fetcher: indico
    start: 16
    lookahead: 2
    program_url_template: "https://dknog{n}.dknog.dk/"
    manual_fallback_url_template: "https://dknog{n}.dknog.dk/"
    notes: "Danish network operators (Copenhagen): DC and backbone networking, BGP/EVPN, automation, security and operator workshops. Contributions carry abstracts, speakers and material via the Indico export."

  # ITNOG: one static page per meeting (itnog.it/itnog<n>) with program
  # tables — Start | End | Title | Speakers | Slides — linking PDF decks
  # under files/. Titles are Italian and presented as-is; day-1 vendor
  # workshops use a Title | Sponsor shape that the same parser reads.
  - series: itnog
    enumerate: ordinal
    key_template: "itnog-{n}"
    name_template: "ITNOG{n}"
    description: "The Italian network operators' conference on Internet infrastructure, routing, IPv6, peering, data centers, and security."
    fetcher: itnog
    start: 9
    lookahead: 2
    program_url_template: "https://www.itnog.it/itnog{n}"
    manual_fallback_url_template: "https://www.itnog.it/itnog{n}"
    notes: "Italian network operators: backbone and DC networking (SR-MPLS, EVPN/VXLAN), peering, IPv6, security. Italian titles, slides as PDFs; no abstracts published."

  # Netnod Tech Meeting: the autumn meeting (the spring Netnod Meeting is a
  # separate page pattern; add it by hand if wanted). The agenda renders as
  # nn-agenda paragraphs — date label, time, title, speaker with company and
  # presentation links under /sites/default/files/NetnodMeetingPresentations/.
  # The URL carries the year; the page scan finds the exact date.
  - series: netnod
    enumerate: year
    key_template: "netnod-{year}"
    name_template: "Netnod Tech Meeting {year}"
    description: "Netnod's technical meeting on interconnection, Internet exchanges, routing security, DNS, timing, and network infrastructure."
    fetcher: netnod
    start: 2025
    end_date_hint: "10-06"
    program_url_template: "https://www.netnod.se/netnod-tech-meeting-{year}"
    manual_fallback_url_template: "https://www.netnod.se/netnod-tech-meeting-{year}"
    notes: "Swedish IXP and NOG (200+ attendees, Stockholm): IX and interconnection, routing security (RPKI/ASPA), optics, DNS and NTP infrastructure, DC networking. Titles, speakers and slides; no abstracts."

  # CfgMgmtCamp runs its CfP on Pretalx (cfp.cfgmgmtcamp.be, also served as
  # cfp.cfgmgmtcamp.org) and exposes the schedule export JSON directly; the
  # generic Pretalx fetcher reads it. Held in Ghent the days after FOSDEM.
  - series: cfgmgmtcamp
    enumerate: year
    key_template: "cfgmgmtcamp-{year}"
    name_template: "CfgMgmtCamp Ghent {year}"
    description: "An open-source infrastructure automation conference covering configuration management, GitOps, network automation, and immutable systems."
    fetcher: pretalx
    start: 2026
    lookahead: 2
    program_url_template: "https://cfp.cfgmgmtcamp.be/ghent{year}/schedule/export/schedule.json"
    manual_fallback_url_template: "https://cfp.cfgmgmtcamp.be/ghent{year}/schedule/"
    notes: "The open automation conference next to FOSDEM: Ansible/Puppet/Salt/CFEngine communities, infrastructure automation, GitOps, network automation, immutable infrastructure. Full abstracts from the Pretalx export."

  # OCP Global Summit: every edition is its own host on the FN TECH event
  # platform ({year}ocpglobal.fnvirtual.app), and the whole schedule — titles,
  # speakers, full abstracts, tracks, YouTube recordings, material links — is
  # baked into the Gatsby app bundle the schedule page embeds. No public API;
  # the fetcher parses the JSON out of the bundle (see conferences/fetchers/ocp.py).
  # A future year's host does not resolve until OCP builds the site, which is
  # discovery's "not up yet" signal; past hosts stay up. The 2025-2026 series
  # scope is the Global Summit only (San Jose, each October) — EMEA and APAC
  # editions live on their own hosts and can be added by hand if wanted.
  - series: ocp
    enumerate: year
    key_template: "ocp-{year}"
    name_template: "OCP Global Summit {year}"
    description: "The Open Compute Project summit on open data-center hardware, AI infrastructure, networking, storage, power, cooling, and security."
    fetcher: ocp
    start: 2025
    lookahead: 2
    program_url_template: "https://{year}ocpglobal.fnvirtual.app/a/schedule/"
    manual_fallback_url_template: "https://{year}ocpglobal.fnvirtual.app/a/schedule/"
    notes: "Open Compute Project's flagship summit (~4,000 attendees, San Jose): open datacenter hardware — AI cluster networking and photonics, rack and power, cooling, server and storage, hardware security and manageability. Full abstracts from the event app's data bundle; YouTube recordings on OCP's channel; specs and white papers linked as materials."

  # MLSys — the systems-for-ML conference (papers + invited talks on
  # mlsys.org's own virtual site). Titles, authors and full abstracts; each
  # paper links its OpenReview page/pdf and the SlidesLive recording. The
  # series grew sharply: 61 papers in 2025, 173 in 2026.
  - series: mlsys
    enumerate: year
    key_template: "mlsys-{year}"
    name_template: "MLSys {year}"
    description: "A research conference on systems for machine learning, including training and inference infrastructure, distributed systems, and ML compilers."
    fetcher: mlsys
    start: 2025
    lookahead: 2
    end_date_hint: "05-22"
    program_url_template: "https://mlsys.org/virtual/{year}/papers.html?filter=titles"
    manual_fallback_url_template: "https://mlsys.org/Conferences/{year}"
    notes: "The systems-for-machine-learning conference (peer-reviewed, ~1,000 attendees): training and inference infrastructure, LLM serving, GPU/accelerator systems, distributed ML, compilers and runtime for ML. Papers with full abstracts plus invited talks, from the conference's virtual site; OpenReview pdfs and SlidesLive recordings linked per paper."

  # PyTorch Conference, run by the Linux Foundation on a stable event page that
