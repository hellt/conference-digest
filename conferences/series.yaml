    notes: "Linux Foundation open networking and edge: disaggregation, network automation, cloud-native telecom, edge AI, APIs and production operations. Titles, speakers, abstracts and speaker decks from Sched; recordings on the official LF Networking YouTube channel (@lfnetworking)."

  # OPI Summit on DPUs/IPUs: one Sched site per year, read by the generic
