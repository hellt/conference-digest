    program_url_template: "https://atscaleconference.com/events/ai-data-{year}/"
    manual_fallback_url_template: "https://atscaleconference.com/events/ai-data-{year}/"
    notes: "Meta's AI and data systems event, bringing together the earlier Data, AI and AI Infra @Scale series: agents, recommender systems, ML infrastructure, training data and data platforms. Talks and poster sessions with abstracts; recordings on @scaleconference."

  - series: atscale-systems-reliability
    enumerate: year
