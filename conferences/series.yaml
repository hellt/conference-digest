    program_url_template: "https://atscaleconference.com/events/networking-{year}/"
    manual_fallback_url_template: "https://atscaleconference.com/events/networking-{year}/"
    notes: "Meta's large-scale networking event: AI fabrics and RDMA, datacenter and backbone architecture, network operations, optics, interconnects and co-design. Full agenda with speakers and abstracts; recordings on the official @Scale YouTube channel (@scaleconference)."

  - series: atscale-product
    enumerate: year
    key_template: "atscale-product-{year}"
