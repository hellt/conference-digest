    manual_fallback_url_template: "https://atscaleconference.com/events/systems-reliability-{year}/"
    notes: "Meta's systems and reliability event, consolidating the earlier Systems and Reliability @Scale series: AI infrastructure, cloud and datacenter systems, production operations, security and incident response. Full agenda with abstracts; recordings on @scaleconference."
