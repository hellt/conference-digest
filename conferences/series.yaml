    program_url_template: "https://events.linuxfoundation.org/pytorch-conference-north-america/"
    manual_fallback_url_template: "https://events.linuxfoundation.org/pytorch-conference-north-america/program/schedule/"
    notes: "The PyTorch ecosystem conference (~1,500 attendees): PyTorch core, torch.compile and performance, distributed training and inference, production ML systems, hardware/accelerator integration. Titles, speakers and full abstracts from the Sessionize schedule the event page links; recordings on the PyTorch YouTube channel."

