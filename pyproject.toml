[project]
name = "conference-digest"
version = "0.1.0"
description = "Conference digests for a networking, security and identity PM"
readme = "README.md"
requires-python = ">=3.11"
# The pipeline itself installs requirements.txt; this project file only pins
# the site toolchain, run through uv as on containerlab.dev.
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
docs = ["zensical==0.0.74"]

[tool.uv]
package = false
